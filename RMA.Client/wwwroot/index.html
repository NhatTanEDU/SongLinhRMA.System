<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMA.Client</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="RMA.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        window.fileDownload = {
            chunks: [],
            fileName: '',
            contentType: '',
            init: function (name, type) {
                this.chunks = [];
                this.fileName = name;
                this.contentType = type;
            },
            appendChunk: function (base64Chunk) {
                const binaryString = window.atob(base64Chunk);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                this.chunks.push(bytes);
            },
            save: function () {
                const blob = new Blob(this.chunks, { type: this.contentType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = this.fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                this.chunks = []; // Clear reference to prevent memory leaks
            }
        };

        window.saveFileWithSystemAccess = async function (fileName, jsonContent) {
            if (typeof window.showSaveFilePicker !== 'function') {
                console.warn("File System Access API is not supported in this browser. Falling back to default download.");
                return null;
            }
            try {
                const options = {
                    suggestedName: fileName,
                    types: [{
                        description: 'JSON Backup Files',
                        accept: {
                            'application/json': ['.json'],
                        },
                    }],
                };
                const handle = await window.showSaveFilePicker(options);
                const writable = await handle.createWritable();
                await writable.write(jsonContent);
                await writable.close();
                return true;
            } catch (err) {
                console.error("showSaveFilePicker error:", err);
                if (err.name === 'AbortError') {
                    return false;
                }
                return null;
            }
        };
    </script>
</body>

</html>
